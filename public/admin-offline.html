<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Offline · Setuware Admin</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center; background:#0b1020; color:#fff; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .card { max-width:22rem; padding:2rem; text-align:center; }
  .dot { width:56px; height:56px; margin:0 auto 1.25rem; border-radius:16px; background:linear-gradient(135deg,#2f56d8,#0a8ea6); display:flex; align-items:center; justify-content:center; font-weight:800; letter-spacing:.04em; }
  h1 { font-size:1.4rem; margin:0 0 .5rem; }
  p { color:rgba(255,255,255,.65); line-height:1.6; margin:0 0 1.5rem; }
  button { border:0; border-radius:999px; padding:.75rem 1.5rem; font-weight:700; background:#fff; color:#0b1020; cursor:pointer; }
</style>
</head>
<body>
  <div class="card">
    <div class="dot">SW</div>
    <h1>You're offline</h1>
    <p>Setuware Admin needs an internet connection to load leads and enquiries. Your data is never stored on this device.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
