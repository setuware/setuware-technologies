# /etc/nginx/sites-available/setuware  (symlink into sites-enabled)
#
# Reverse proxy for setuware.in. After the first `sudo certbot --nginx -d
# setuware.in -d www.setuware.in`, Certbot adds the certificate lines and the
# HTTP→HTTPS redirect to this file.

upstream setuware_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

# www → apex
server {
  listen 80;
  listen [::]:80;
  server_name www.setuware.in;
  return 301 https://setuware.in$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  # core.setuware.in is the team portal; the app routes it by Host header.
  server_name setuware.in core.setuware.in;

  # CV and image uploads from the admin and careers pages are up to 5 MB.
  client_max_body_size 8m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # Hashed build assets never change.
  location /_next/static/ {
    proxy_pass http://setuware_app;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Videos and photos: cache for a week; allow range requests for video.
  location ~* ^/(media|images)/ {
    proxy_pass http://setuware_app;
    proxy_set_header Host $host;
    proxy_set_header Range $http_range;
    add_header Cache-Control "public, max-age=604800";
  }

  location / {
    proxy_pass http://setuware_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
